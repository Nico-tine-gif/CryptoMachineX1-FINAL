name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Accept Android Licenses and install build-tools 37
        run: |
          sudo apt update
          sudo apt install -y aidl || true
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;37.0.0" "build-tools;33.0.2" "platforms;android-33" "platform-tools" || true
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/build-tools || true
          sudo cp -r $ANDROID_HOME/build-tools/37.0.0 /home/runner/.buildozer/android/platform/android-sdk/build-tools/ 2>/dev/null || sudo cp -r $ANDROID_HOME/build-tools/33.0.2 /home/runner/.buildozer/android/platform/android-sdk/build-tools/ 2>/dev/null || true
          ls $ANDROID_HOME/build-tools/ || true
      - name: Install buildozer
        run: |
          sudo apt install -y zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install cython==0.29.36
          pip install https://github.com/kivy/buildozer/archive/master.zip
          pip install https://github.com/kivy/python-for-android/archive/master.zip
      - name: Build APK with Buildozer
        env:
          ACCEPT_SDK_LICENSE_AGREEMENT: "Y"
        run: |
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoMachineX1-APK
          path: bin/*.apk
